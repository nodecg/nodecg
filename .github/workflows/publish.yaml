name: Publish

on:
  push:
    branches:
      - main
      - next

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable pnpm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build
      - run: |
          tag=latest
          if [ -f .changeset/pre.json ]; then
            tag="$(jq -r .tag .changeset/pre.json)"
          fi
          pnpm publish -r --tag "$tag" --provenance --report-summary --publish-branch "$GITHUB_REF_NAME"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/create-release.bash
