name: Publish

on:
  push:
    branches:
      - main
      - next

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  mode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@v6
      - id: pending
        run: |
          if ls .changeset/*.md; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

  version-pr:
    needs: mode
    if: needs.mode.outputs.pending == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: corepack enable pnpm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build
      - run: bash scripts/add-internal-changeset.bash
      - uses: changesets/action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  publish:
    needs: mode
    if: needs.mode.outputs.pending == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - run: corepack enable pnpm
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm stage publish -r --provenance --report-summary
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/create-github-release.bash
